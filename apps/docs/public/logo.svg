  <title id="title">Liven UI logo</title>
  <desc id="desc">Five connected circles with interactive color and rotation.</desc>

  <style>
    svg {
      transition: transform 0.5s ease, filter 0.5s ease;
    }
    svg:hover {
      transform: scale(1.10) rotate(360deg);
      filter: drop-shadow(0 8px 16px rgba(0,0,0,0.25));
    }

    #left-eye, #right-eye, #center, #bottom-left, #bottom-right {
      transition: fill 0.5s ease;
    }
    svg:hover #left-eye { fill: #065F46; }
    svg:hover #right-eye { fill: #064E3B; }
    svg:hover #center { fill: #059669; }
    svg:hover #bottom-left { fill: #047857; }
    svg:hover #bottom-right { fill: #10B981; }
  </style>


